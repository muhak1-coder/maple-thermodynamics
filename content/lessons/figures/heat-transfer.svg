<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190"><title>Net heat transfer from a warmer block to cooler water</title><rect width="640" height="190" fill="#f2f7fa"/><rect x="30" y="45" width="170" height="95" rx="12" fill="#f7d8b4" stroke="#b7641b"/><rect x="440" y="45" width="170" height="95" rx="12" fill="#cbe5f5" stroke="#2c6f9b"/><g font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#17334a"><text x="115" y="85">Warm block</text><text x="115" y="114">42 °C</text><text x="525" y="85">Cool water</text><text x="525" y="114">17 °C</text><text x="320" y="63">Net heat transfer</text><text x="320" y="170">Direction depends on temperature, not sample size.</text></g><path d="M220 100 H410" stroke="#246575" stroke-width="5"/><path d="M410 100 L394 91 L394 109 Z" fill="#246575"/></svg>