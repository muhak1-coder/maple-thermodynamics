<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190"><title>Celsius and Kelvin use equal-size temperature steps</title><rect width="640" height="190" fill="#f2f7fa"/><g stroke="#246575" stroke-width="3"><path d="M110 65 H555 M110 130 H555"/><path d="M140 55 V75 M335 55 V75 M530 55 V75 M140 120 V140 M335 120 V140 M530 120 V140"/></g><g font-family="DejaVu Sans" font-size="17" text-anchor="middle" fill="#17334a"><text x="50" y="70">°C</text><text x="50" y="135">K</text><text x="140" y="45">0</text><text x="335" y="45">50</text><text x="530" y="45">100</text><text x="140" y="164">273.15</text><text x="335" y="164">323.15</text><text x="530" y="164">373.15</text><text x="335" y="101">Same spacing; different zero point</text></g></svg>